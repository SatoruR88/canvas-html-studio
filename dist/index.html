<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HTMLとCSSを紙面のように直接編集できるビジュアルエディター" />
  <title>Canvas HTML Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div>
          <div class="brand-name">Canvas</div>
          <div class="file-name"><span id="fileName">product-page.html</span><span class="saved-dot" id="savedDot" aria-hidden="true"></span><span id="saveLabel">端末に保存済み</span></div>
        </div>
      </div>
      <nav class="history-actions" aria-label="編集履歴と表示">
        <button class="icon-btn" id="undoBtn" title="元に戻す（Ctrl+Z）" aria-label="元に戻す">↶</button>
        <button class="icon-btn" id="redoBtn" title="やり直す（Ctrl+Shift+Z）" aria-label="やり直す">↷</button>
        <span class="divider"></span>
        <button class="icon-btn active" id="desktopBtn" title="デスクトップ表示" aria-label="デスクトップ表示">▰</button>
        <button class="icon-btn" id="mobileBtn" title="モバイル表示" aria-label="モバイル表示">▯</button>
      </nav>
      <div class="top-actions">
        <input id="fileInput" type="file" accept=".html,.htm,.css,.zip,text/html,text/css,application/zip" multiple hidden />
        <input id="folderInput" type="file" webkitdirectory multiple hidden />
        <input id="assetInput" type="file" accept="image/*,.svg,.woff,.woff2,.ttf,.otf" multiple hidden />
        <button class="secondary-btn" id="importBtn"><span aria-hidden="true">＋</span> 読み込む</button>
        <div class="import-menu" id="importMenu" aria-hidden="true">
          <button data-import="files"><strong>ファイルを選択</strong><span>HTML・CSS・ZIP</span></button>
          <button data-import="folder"><strong>フォルダを開く</strong><span>画像やフォントもまとめて</span></button>
        </div>
        <button class="secondary-btn" id="codeBtn"><span aria-hidden="true">&lt;/&gt;</span> コード</button>
        <button class="secondary-btn preview-btn" id="previewBtn"><span aria-hidden="true">◉</span> プレビュー</button>
        <button class="primary-btn" id="exportBtn">ZIP書き出し <span aria-hidden="true">↓</span></button>
      </div>
    </header>

    <aside class="tool-rail" aria-label="編集ツール">
      <button class="rail-item active" data-mode="select"><span class="rail-icon">↖</span><span>選択</span></button>
      <button class="rail-item" data-add="heading"><span class="rail-icon">T</span><span>見出し</span></button>
      <button class="rail-item" data-add="text"><span class="rail-icon">¶</span><span>テキスト</span></button>
      <button class="rail-item" data-add="button"><span class="rail-icon">▭</span><span>ボタン</span></button>
      <button class="rail-item" data-add="divider"><span class="rail-icon">―</span><span>区切り線</span></button>
      <button class="rail-item" id="assetsBtn"><span class="rail-icon">◇</span><span>素材</span><span class="warning-badge" id="assetBadge" hidden>0</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-item" id="layersBtn"><span class="rail-icon">▱</span><span>DOM</span></button>
    </aside>

    <main class="workspace">
      <div class="workspace-toolbar">
        <div class="breadcrumbs"><span>ページ</span><span>/</span><strong id="crumbName">product-page.html</strong></div>
        <div class="drop-hint">フォルダまたはZIPをここへドロップ</div>
        <div class="zoom-control">
          <button id="zoomOut" aria-label="縮小">−</button><span id="zoomLabel">86%</span><button id="zoomIn" aria-label="拡大">＋</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <div class="drop-overlay" id="dropOverlay"><strong>Webサイト一式をドロップ</strong><span>フォルダ・ZIP・HTML/CSSに対応</span></div>
        <div class="page-wrap" id="pageWrap">
          <div class="page-badge">LIVE DOCUMENT · <span id="viewportLabel">DESKTOP</span></div>
          <div class="page-surface" id="pageSurface">
            <iframe id="canvasFrame" title="HTML編集キャンバス" sandbox="allow-same-origin"></iframe>
            <div class="selection-overlay" id="selectionOverlay" aria-hidden="true">
              <button class="selection-label" id="moveHandle" title="ドラッグして移動">H1 · 見出し</button>
              <span class="resize-handle nw" data-resize="nw"></span><span class="resize-handle ne" data-resize="ne"></span>
              <span class="resize-handle sw" data-resize="sw"></span><span class="resize-handle se" data-resize="se"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <aside class="properties" aria-label="プロパティ">
      <div class="properties-head">
        <div><span class="section-kicker">選択中 · <span id="selectedTag">H1</span></span><h2 id="selectedName">メイン見出し</h2></div>
        <button class="more-btn" id="focusDomBtn" aria-label="DOMツリーで表示">▱</button>
      </div>
      <section class="property-section">
        <h3>配置</h3>
        <div class="align-grid" role="group" aria-label="テキスト配置">
          <button class="active" data-align="left">≡</button><button data-align="center">≣</button><button data-align="right">≡</button><button data-align="justify">☷</button>
        </div>
      </section>
      <section class="property-section">
        <div class="section-title-row"><h3>タイポグラフィ</h3><button class="reset-link" id="resetType">リセット</button></div>
        <label>フォント
          <select id="fontFamily"><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option><option value="'Times New Roman', serif">Times New Roman</option><option value="system-ui, sans-serif">System UI</option></select>
        </label>
        <div class="field-pair">
          <label>サイズ<div class="input-unit"><input id="fontSize" type="number" min="6" max="300"><span>px</span></div></label>
          <label>太さ<select id="fontWeight"><option value="300">Light</option><option value="400">Regular</option><option value="500">Medium</option><option value="600">Semibold</option><option value="700">Bold</option><option value="800">Heavy</option></select></label>
        </div>
        <div class="field-pair">
          <label>行間<div class="input-unit"><input id="lineHeight" type="number" min="0.5" max="5" step="0.05"><span>×</span></div></label>
          <label>字間<div class="input-unit"><input id="letterSpacing" type="number" min="-20" max="50"><span>px</span></div></label>
        </div>
      </section>
      <section class="property-section">
        <h3>サイズと位置</h3>
        <div class="field-pair">
          <label>幅<div class="input-unit"><input id="elementWidth" type="number" min="1"><span>px</span></div></label>
          <label>高さ<div class="input-unit"><input id="elementHeight" type="number" min="1"><span>px</span></div></label>
        </div>
        <div class="field-pair">
          <label>X<div class="input-unit"><input id="positionX" type="number"><span>px</span></div></label>
          <label>Y<div class="input-unit"><input id="positionY" type="number"><span>px</span></div></label>
        </div>
        <button class="wide-reset" id="resetPosition">位置とサイズを自動に戻す</button>
      </section>
      <section class="property-section">
        <h3>カラー</h3>
        <div class="color-control"><input type="color" id="textColor" value="#151823" aria-label="文字色"><input type="text" id="colorHex" value="#151823" aria-label="カラーコード"><span>100%</span></div>
      </section>
      <section class="property-section">
        <h3>余白</h3>
        <div class="spacing-grid">
          <label><span>上</span><input id="marginTop" type="number"><small>px</small></label><label><span>下</span><input id="marginBottom" type="number"><small>px</small></label>
        </div>
      </section>
      <div class="properties-footer"><button id="duplicateBtn">複製</button><button id="deleteBtn" class="danger">削除</button></div>
    </aside>

    <div class="code-drawer" id="codeDrawer" aria-hidden="true">
      <div class="drawer-head"><div><span class="section-kicker">ソース</span><h2>コード編集</h2></div><button id="closeCode" aria-label="閉じる">×</button></div>
      <div class="code-tabs" role="tablist"><button class="active" data-code-tab="html">HTML</button><button data-code-tab="css">CSS</button></div>
      <textarea id="codeEditor" spellcheck="false" aria-label="コードエディター"></textarea>
      <div class="drawer-actions"><span id="codeStatus">変更はキャンバスに反映されます</span><button id="applyCode" class="primary-btn">コードを反映</button></div>
    </div>

    <div class="layers-popover" id="layersPopover" aria-hidden="true">
      <div class="layers-head"><div><span class="section-kicker">構造</span><h3>DOMツリー</h3></div><span>ドラッグで並べ替え</span></div>
      <div id="layersList"></div>
    </div>

    <div class="assets-popover" id="assetsPopover" aria-hidden="true">
      <div class="assets-head">
        <div><span class="section-kicker">端末内の素材</span><h3>アセット</h3></div>
        <button id="addAssetBtn">＋ 追加</button>
      </div>
      <div class="asset-summary" id="assetSummary">素材はまだありません</div>
      <div class="missing-list" id="missingList" hidden></div>
      <div class="asset-grid" id="assetGrid"></div>
      <div class="asset-files" id="assetFiles"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
