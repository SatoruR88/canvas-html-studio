[package]
name = "canvas-html-studio"
version = "0.1.1"
description = "Local-first visual HTML editor"
authors = ["Canvas HTML Studio"]
license = "MIT"
edition = "2021"

[lib]
name = "canvas_html_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"
walkdir = "2"
notify = "8"
